name: Android mobile integration build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-build.yml'
      - 'mobile-overlay/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration project
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Checkout upstream Nuvio Mobile Enhanced
        uses: actions/checkout@v4
        with:
          repository: AKRusso/NuvioMobile-Enhanced
          ref: ac03c46a159e7e4bbbcd77ad4bdf6ea604b34107
          path: upstream
          submodules: false

      - name: Apply mobile overlay
        run: |
          set -euo pipefail
          python3 integration/scripts/apply-mobile-overlay.py upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Cinemana resource integration
        working-directory: upstream
        run: ./gradlew :composeApp:testAndroidHostTest -Pnuvio.android.distribution=full --tests 'com.nuvio.android.cinemana.*' --stacktrace

      - name: Assemble mobile debug APK
        working-directory: upstream
        env:
          NUVIO_LEGACY_UPDATE_COMPAT_SIGNING: 'false'
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full --stacktrace

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-build-reports
          path: |
            upstream/**/build/reports/**
            upstream/**/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-cinemana-mobile-debug
          path: upstream/androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
