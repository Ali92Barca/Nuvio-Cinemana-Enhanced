name: Android mobile integration build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-build.yml'
      - 'mobile-overlay/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration project
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Checkout upstream Nuvio Mobile Enhanced
        uses: actions/checkout@v4
        with:
          repository: AKRusso/NuvioMobile-Enhanced
          ref: ac03c46a159e7e4bbbcd77ad4bdf6ea604b34107
          path: upstream
          submodules: false

      - name: Apply mobile overlay
        run: |
          set -euo pipefail
          python3 integration/scripts/apply-mobile-overlay.py upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure mobile build
        run: |
          touch upstream/local.properties
          cat >> upstream/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
          kotlin.daemon.jvmargs=-Xmx3g
          org.gradle.workers.max=2
          EOF

      - name: Test Cinemana resource integration
        working-directory: integration
        run: ../upstream/gradlew -p tests/cinemana-jvm test --stacktrace

      - name: Assemble mobile debug APK
        working-directory: upstream
        env:
          NUVIO_LEGACY_UPDATE_COMPAT_SIGNING: 'false'
          NUVIO_UPDATE_GITHUB_OWNER: Ali92Barca
          NUVIO_UPDATE_GITHUB_REPO: Nuvio-Cinemana-Enhanced
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -PnuvioDebugApplicationId=com.ali92barca.nuvio.cinemana.debug --stacktrace

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-build-reports
          path: |
            integration/tests/cinemana-jvm/build/reports/**
            integration/tests/cinemana-jvm/build/test-results/**
            upstream/**/build/reports/**
            upstream/**/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-cinemana-mobile-debug
          path: upstream/androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
